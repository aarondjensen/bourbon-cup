<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="The Bourbon Cup — Ryder Cup-style match play tournament app." />

    <!-- Favicons (all in /public/favicon/) -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- iOS/PWA — added to home screen, this renders as a standalone app.

         status-bar-style MUST stay "black" and NOT go back to
         "black-translucent". With black-translucent iOS starts the page at
         y=0 under the status bar but does NOT grow the layout viewport to
         match — it stays screen_height minus status_bar_height. Measured on
         an iPhone 16 Pro: screen 874pt, window.innerHeight 812pt,
         env(safe-area-inset-top) 62pt, and 874 - 812 = 62 exactly. The page
         gets pulled up under the status bar while keeping the short height,
         so one status-bar's worth of dead space falls out of the BOTTOM and
         the nav can never reach the physical edge. No amount of CSS fixes
         it, because the viewport itself is short.

         With "black", iOS places the web view BELOW the status bar
         (y=62..874), env(safe-area-inset-top) becomes 0, and the nav's
         bottom edge lands on the real bottom of the screen. The app bg is
         #0a0a0b, so an opaque black status bar is visually identical.

         NOTE: iOS snapshots these tags when the icon is added to the home
         screen. Changing them requires deleting and re-adding the icon. -->
    <meta name="apple-mobile-web-app-title" content="Bourbon Cup" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)" />

    <!-- ── The typeface ──────────────────────────────────────────────
         Montserrat is SELF-HOSTED and declared here, in the document, on
         purpose. It used to be a <link> to fonts.googleapis.com that
         theme.js appended at runtime, and that put the font four hops
         behind the first paint: download the JS bundle, evaluate it,
         fetch Google's CSS, then fetch the woff2 off a third origin. With
         `display: swap` the app painted in the system sans the whole time
         and re-lettered when Montserrat finally landed — which on the
         splash is the title changing shape under you, and reads as a
         second screen rather than as a font arriving.

         Declared statically, the preload scanner asks for the font off
         OUR origin in the same breath as the bundle, and 35 KB beats a
         bundle every time, so the first frame is already Montserrat.
         It also means the font is same-origin, which is what lets
         public/sw-cache-rules.js hold it (cross-origin requests are
         `bypass`) — so an installed app cold-starting out of range has
         its typeface on disk instead of doing without.

         The family string itself still lives in theme.js (`FONT`).

         One variable file per subset, weight 400–800, which is every
         weight the app asks for in a single request. latin-ext is
         unicode-range'd and therefore only ever fetched by a name with an
         accent in it; it is here so that name does not render in a
         different face to the one beside it.

         `crossorigin` on the preload is not optional even though this is
         same-origin: fonts are fetched in CORS mode, and a preload whose
         mode disagrees is discarded and fetched a second time. -->
    <link rel="preload" href="/fonts/montserrat-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/montserrat-latin-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/montserrat-latin-ext-var.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>

    <title>The Bourbon Cup</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
