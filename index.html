<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="The Bourbon Cup — Ryder Cup-style match play tournament app." />

    <!-- Favicons (all in /public/favicon/) -->
