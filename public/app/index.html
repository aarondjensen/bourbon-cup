<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Get the App — The Bourbon Cup</title>
  <meta name="description" content="Install The Bourbon Cup on Android or iPhone." />
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/legal.css" />
  <!-- Scoped to this page. legal.css is written for long-form documents —
       privacy policy, account deletion — and this page is two buttons. -->
  <style>
    body { display: flex; align-items: center; min-height: 100vh; padding: 24px 20px; }
    main { max-width: 420px; width: 100%; text-align: center; }
    /* 22.4% is iOS's own corner radius as a fraction of icon width, so the
       tile here is the shape it will be on the home screen rather than a
       rounded rectangle that happens to look close. */
    .icon { width: 96px; height: 96px; border-radius: 22.4%; display: block; margin: 0 auto 16px; }
    .title { font-size: 24px; line-height: 1.2; color: var(--t1); font-weight: 800; margin: 0 0 30px; }
    .stores { display: flex; flex-direction: column; gap: 12px; }
    /* The badges carry their own artwork and their own padding, so the
       container adds none — a box drawn around a store badge is exactly what
       both sets of brand guidelines tell you not to do. */
    .badge { display: inline-flex; align-items: center; gap: 10px; justify-content: center; }
    .badge img { display: block; width: auto; }
    /* Not the same height, because they are not the same kind of file.
       Google's badge is a 646x250 canvas holding 564x168 of artwork — 41px of
       clear space on every side, baked in — and Apple's SVG is 119.66x40 with
       none. Setting both to one height renders the Play badge a third smaller
       than the one beside it. 168/250 = 0.672, so Play is scaled by 1/0.672
       to put the two pieces of ARTWORK at the same height, which is what an
       eye compares and what both sets of guidelines mean by equal prominence.
       Re-measure if either asset is replaced. */
    .badge-apple img { height: 48px; }
    .badge-play  img { height: 71px; }
    /* The clear space is inside the Play image, so the row it sits in already
       has 21px of air above and below that the Apple row does not. Pulling it
       back keeps the gap between the two badges even. */
    .badge-play { margin: -14px 0; }
    /* Unavailable rather than disabled: the badge stays legible, and the word
       beside it says why nothing happens when you tap it. */
    .badge.soon { opacity: .45; cursor: default; }
    /* Under the badge, not beside it. Beside it, the tag is part of the row
       flex centres, so the badge itself lands off-centre and the column of
       two stops reading as a column. */
    .apple-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .soon-tag {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--t3);
    }
    .web { display: inline-block; margin-top: 26px; font-size: 14px; color: var(--t2); }
  </style>
</head>
<body>
<main>
  <!-- The real launcher icon, the same file the installed app shows on a home
       screen — so the page and the thing it installs are visibly one item.
       512px served into a 96px box: it is also the maskable icon, and a
       smaller source would be soft on a phone at 3x. -->
  <img class="icon" src="/favicon/web-app-manifest-512x512.png" alt="" width="96" height="96" />
  <h1 class="title">The Bourbon Cup</h1>

  <div class="stores">
    <!-- The OFFICIAL badges, served from our own origin rather than hotlinked
         off Google's and Apple's CDNs. Google's brand guidelines ask for the
         asset to be hosted; Apple's tolerate either. Self-hosting also means
         this page cannot quietly lose its only two controls the day one of
         those URLs moves. See docs/play-store.md for where they came from.

         Sized by height and never by width — the two have different aspect
         ratios by design — and by DIFFERENT heights, for the reason in the
         stylesheet above. -->
    <a class="badge badge-play" href="https://play.google.com/apps/internaltest/4701112230999898955">
      <img src="/app/google-play-badge.png" alt="Get it on Google Play" />
    </a>

    <!-- No href: there is nowhere to send anybody until the App Store review
         and the unlisted request both come back. A badge that navigates to a
         404 is worse than one that says "soon". Swap the <span> for an <a>
         when the link exists. -->
    <span class="apple-wrap">
      <span class="badge badge-apple soon">
        <img src="/app/app-store-badge.svg" alt="Download on the App Store" />
      </span>
      <span class="soon-tag">Coming soon</span>
    </span>
  </div>


  <a class="web" href="https://www.thebourboncup.com">Or just use the website →</a>
</main>
</body>
</html>
